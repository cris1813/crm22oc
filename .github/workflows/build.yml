name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar proyecto Android
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/share@7 @capacitor/local-notifications@7 @capacitor/filesystem@7 @capacitor/status-bar@7
          mkdir www
          cp index.html www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "cl.bodega.crm",
            "appName": "Bodega CRM",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          M=android/app/src/main
          J=$M/java/cl/bodega/crm
          mkdir -p $J $M/res/xml $M/res/values
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' $M/AndroidManifest.xml
          sed -i 's#<application#<application android:hardwareAccelerated="true"#' $M/AndroidManifest.xml
          sed -i 's#</application>#<service android:name=".WaAutoService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/wa_auto_config" /></service></application>#' $M/AndroidManifest.xml
          cat > $M/res/xml/wa_auto_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:packageNames="com.whatsapp,com.whatsapp.w4b"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="250"
              android:description="@string/wa_auto_desc" />
          EOF
          cat > $M/res/values/wa_auto.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="wa_auto_desc">Permite a Bodega CRM presionar Enviar en WhatsApp para enviar tus campañas.</string></resources>
          EOF
          cat > $J/MainActivity.java <<'EOF'
          package cl.bodega.crm;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              registerPlugin(WaAutoPlugin.class);
              super.onCreate(b);
            }
          }
          EOF
          cat > $J/WaAutoPlugin.java <<'EOF'
          package cl.bodega.crm;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.WindowManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "WaAuto")
          public class WaAutoPlugin extends Plugin {
            @PluginMethod
            public void isEnabled(PluginCall call) {
              String s = Settings.Secure.getString(getContext().getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
              JSObject o = new JSObject();
              o.put("on", s != null && s.contains(getContext().getPackageName() + "/"));
              call.resolve(o);
            }
            @PluginMethod
            public void openSettings(PluginCall call) {
              Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
            }
            @PluginMethod
            public void keepAwake(PluginCall call) {
              final boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
              getActivity().runOnUiThread(() -> {
                if (on) getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                else getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              });
              call.resolve();
            }
            @PluginMethod
            public void send(PluginCall call) {
              String phone = call.getString("phone");
              String text = call.getString("text");
              if (phone == null || text == null || WaAutoService.inst == null) {
                call.reject("no listo");
                return;
              }
              WaAutoService.begin(call);
              Uri u = Uri.parse("whatsapp://send?phone=" + phone + "&text=" + Uri.encode(text));
              try {
                launch(u, "com.whatsapp");
              } catch (Exception e) {
                try {
                  launch(u, "com.whatsapp.w4b");
                } catch (Exception e2) {
                  WaAutoService.pending = null;
                  call.reject("sin WhatsApp");
                }
              }
            }
            private void launch(Uri u, String pkg) {
              Intent i = new Intent(Intent.ACTION_VIEW, u);
              i.setPackage(pkg);
              getActivity().startActivity(i);
            }
          }
          EOF
          cat > $J/WaAutoService.java <<'EOF'
          package cl.bodega.crm;
          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PluginCall;
          import java.util.List;
          public class WaAutoService extends AccessibilityService {
            static volatile PluginCall pending;
            static volatile boolean clicked;
            static WaAutoService inst;
            long lastScan = 0;
            final Handler h = new Handler(Looper.getMainLooper());
            static void begin(PluginCall c) {
              pending = c;
              clicked = false;
              if (inst != null) inst.watch(c);
            }
            void watch(final PluginCall c) {
              h.postDelayed(() -> { if (pending == c) finish(false); }, 20000);
            }
            @Override
            protected void onServiceConnected() { inst = this; }
            @Override
            public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }
            @Override
            public void onInterrupt() {}
            @Override
            public void onAccessibilityEvent(AccessibilityEvent ev) {
              if (pending == null || clicked) return;
              long now = SystemClock.uptimeMillis();
              if (now - lastScan < 280) return;
              lastScan = now;
              AccessibilityNodeInfo root = getRootInActiveWindow();
              if (root == null) return;
              AccessibilityNodeInfo b = find(root);
              if (b != null && b.isEnabled()) {
                clicked = true;
                b.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                h.postDelayed(() -> finish(true), 1350);
              }
            }
            AccessibilityNodeInfo find(AccessibilityNodeInfo n) {
              String[] ids = {"com.whatsapp:id/send", "com.whatsapp.w4b:id/send", "com.whatsapp:id/send_container", "com.whatsapp.w4b:id/send_container"};
              for (String id : ids) {
                List<AccessibilityNodeInfo> l = n.findAccessibilityNodeInfosByViewId(id);
                if (l != null && !l.isEmpty()) return l.get(0);
              }
              return walk(n);
            }
            AccessibilityNodeInfo walk(AccessibilityNodeInfo n) {
              if (n == null) return null;
              CharSequence d = n.getContentDescription();
              if (d != null) {
                String s = d.toString();
                if (s.equalsIgnoreCase("Enviar") || s.equalsIgnoreCase("Send")) return n;
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = walk(n.getChild(i));
                if (r != null) return r;
              }
              return null;
            }
            void finish(final boolean ok) {
              final PluginCall c = pending;
              pending = null;
              if (c == null) return;
              performGlobalAction(GLOBAL_ACTION_BACK);
              h.postDelayed(() -> performGlobalAction(GLOBAL_ACTION_BACK), 650);
              h.postDelayed(() -> {
                Intent i = getPackageManager().getLaunchIntentForPackage(getPackageName());
                if (i != null) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(i);
                }
                JSObject o = new JSObject();
                o.put("ok", ok);
                c.resolve(o);
              }, 1450);
            }
          }
          EOF
      - name: Llave de firma estable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.android
          if gh release download keystore -p debug.keystore -D ~/.android; then
            echo "Llave existente"
          else
            keytool -genkey -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            gh release create keystore ~/.android/debug.keystore --title "keystore" --notes "No borrar: llave de firma de la app"
          fi
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BodegaCRM.apk
      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bodega CRM ${{ github.run_number }}
          files: BodegaCRM.apk
