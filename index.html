<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bodega CRM</title><style>
:root{--bg:#edf0f5;--c:#fff;--c2:#e4e9f2;--tx:#14213d;--mu:#6b7690;--g:#1fa855;--bl:#2563eb;--or:#ff7a1a;--rd:#d93a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px;font-size:22px;font-weight:800;letter-spacing:-.4px}
main{flex:1;overflow-y:auto;padding:4px 14px 100px}
h3{margin:18px 2px 6px;font-size:16px}
.v{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card{background:var(--c);border-radius:18px;padding:12px;margin:8px 0;animation:in .4s both;transition:transform .15s;box-shadow:0 1px 3px #14213d14}
.card:active{transform:scale(.975)}
.r{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:14px;background:var(--dk);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.f{flex:1;min-width:0}.f b{display:block}
small,.mu{color:var(--mu);display:block;font-size:12.5px;line-height:1.35}
.rd{color:var(--rd);font-weight:700}
.ac{display:flex;gap:8px;margin-top:10px}
.b{flex:1;border:0;border-radius:14px;padding:12px 8px;font:700 14px system-ui;background:var(--bl);color:#fff;transition:transform .12s,filter .12s}
.b:active{transform:scale(.94);filter:brightness(.9)}
.b.g{background:var(--g)}.b.o{background:var(--or)}.b.l{background:var(--c2);color:var(--tx)}
input,select,textarea{width:100%;border:0;background:var(--c2);color:var(--tx);border-radius:12px;padding:12px;margin:5px 0;font:15px system-ui}
textarea{min-height:90px;resize:none}
label{font-size:13px;color:var(--mu)}
.ch{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.ch span{padding:8px 14px;border-radius:20px;background:var(--c);white-space:nowrap;font-weight:600;transition:.2s}
.ch span.on{background:var(--dk);color:#fff}
.st{display:flex;gap:8px;margin-top:6px}.st div{flex:1;background:var(--dk);color:#fff;border-radius:16px;padding:12px;font-size:12px}.st b{display:block;font-size:26px}
.pg{height:8px;border-radius:8px;background:var(--c2);margin:8px 0;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);transition:width .5s}
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--dk);border-radius:24px;display:flex;padding:6px;box-shadow:0 8px 24px #14213d55}
nav button{flex:1;border:0;background:none;color:#9fb0d6;padding:8px 0;border-radius:18px;font:600 11px system-ui;transition:.25s}
nav button span{display:block;font-size:20px;transition:transform .25s}
nav button.on{background:#ffffff22;color:#fff}nav button.on span{transform:translateY(-2px) scale(1.15)}
#sh{position:fixed;inset:0;background:#14213d88;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end}
#sh.on{opacity:1;pointer-events:auto}
.bx{background:var(--c);width:100%;max-height:90dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#sh.on .bx{transform:none}
.gr{width:40px;height:5px;border-radius:5px;background:var(--c2);margin:0 auto 8px}
#ts{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--dk);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:85%}
#ts.on{opacity:1;transform:translate(-50%,0)}
#chat{max-height:52dvh;overflow-y:auto}
.m{padding:10px 12px;border-radius:16px;margin:6px 0;max-width:90%;line-height:1.4;animation:in .25s}
.m.u{background:var(--dk);color:#fff;margin-left:auto}.m.a{background:var(--c)}
.bar{display:flex;gap:6px}.bar input{flex:1}.bar button{flex:none;width:52px}
.gear{float:right;border:0;background:var(--c);border-radius:14px;width:40px;height:40px;font-size:18px}
.le{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--c2);animation:in .3s both}.le>span{font-size:20px}.le i{color:var(--mu);font-style:normal;padding:4px 8px}
.bx .ch span{background:var(--c2)}.bx .ch span.on{background:var(--dk);color:#fff}.bx .m.a{background:var(--c2)}.bx .card{background:var(--bg);box-shadow:none}
.st b{font-size:21px}
.th{display:none;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:6px 0}
.wb{background:#d9fdd3;color:#111;border-radius:14px 14px 14px 4px;padding:10px 12px;white-space:pre-wrap;line-height:1.4;font-size:14px;margin:8px 0;word-break:break-word}
:root{color-scheme:light dark;--dk:#14213d;--sp:cubic-bezier(.34,1.45,.64,1)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1322;--c:#172036;--c2:#222e4a;--tx:#e8eeff;--mu:#93a1c4;--dk:#2c3d72}.card{box-shadow:none}}
@keyframes in{from{opacity:0;transform:translate(var(--dx,0px),14px) scale(.985)}}
.v{animation:in .42s var(--sp)}
.card{animation:in .5s var(--sp) both;transition:transform .2s var(--sp)}
.card:active{transform:scale(.97)}
.rf,.rf .card,.rf .le{animation:none!important}
.pg i{animation:grow .9s var(--sp) both}@keyframes grow{from{width:0}}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:#ffffff26;transition:transform .5s var(--sp)}
nav button{position:relative;z-index:1}nav button.on{background:none}
.bx{transition:transform .5s var(--sp)}
.gr{width:100%;height:26px;background:none;border-radius:0;margin:0;position:relative}
.gr::before{content:'';position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:#aab3c9}
.out{animation:out .38s ease forwards;overflow:hidden}
@keyframes out{to{opacity:0;transform:translateX(70px);max-height:0;padding-top:0;padding-bottom:0;margin:0}}
.fx{position:fixed;pointer-events:none;font-size:22px;z-index:99;animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
.card .ch span{background:var(--c2)}
.tg{display:inline-block;background:var(--c2);color:var(--tx);border-radius:10px;padding:1px 8px;margin-right:4px;font-weight:700}
.sel.on{outline:2px solid var(--g)}.sel .av{transition:.25s}.sel.on .av{background:var(--g)}
#sb{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--dk);color:#fff;border-radius:20px;padding:10px;display:flex;gap:8px;align-items:center;transform:translateY(160%);transition:transform .5s var(--sp);z-index:5}
#sb.on{transform:none}
/* ===== Liquid glass ===== */
:root{--bg:#eaf0fc;--gl:rgba(255,255,255,.55);--gl2:rgba(255,255,255,.34);--gs:rgba(255,255,255,.78);--gb:rgba(255,255,255,.8);--hl:rgba(255,255,255,.95);--sd:rgba(40,60,130,.14);--sheen:rgba(255,255,255,.55);--fi:rgba(90,110,170,.13);--pl:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.4))}
@media(prefers-color-scheme:dark){:root{--bg:#0a1020;--gl:rgba(40,54,92,.5);--gl2:rgba(40,54,92,.34);--gs:rgba(22,32,60,.8);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.26);--sd:rgba(0,0,0,.4);--sheen:rgba(255,255,255,.13);--fi:rgba(255,255,255,.09);--pl:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1))}body::before{opacity:.5}}
html{background:var(--bg)}body{background:none}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(38% 30% at 15% 12%,#7aa7ffaa,transparent 70%),radial-gradient(34% 28% at 88% 22%,#ff9ad5aa,transparent 70%),radial-gradient(40% 32% at 72% 88%,#7ce6c4aa,transparent 70%),radial-gradient(30% 26% at 8% 80%,#ffc78aaa,transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.12) rotate(3deg)}}
.card{background:linear-gradient(135deg,var(--sheen),transparent 45%),var(--gl);border:1px solid var(--gb);box-shadow:0 8px 28px var(--sd),inset 0 1px 0 var(--hl),inset 0 -1px 0 rgba(255,255,255,.12)}
.bx .card{background:var(--gl2);box-shadow:none}
.st div{border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 24px var(--sd),inset 0 1px 0 rgba(255,255,255,.55)}
.st div:nth-child(1){background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%),linear-gradient(135deg,#3b6cf0,#6f9bff)}
.st div:nth-child(2){background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%),linear-gradient(135deg,#0f9d58,#3ddc97)}
.st div:nth-child(3){background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%),linear-gradient(135deg,#ff7a1a,#ffb25b)}
.av{background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 55%),linear-gradient(135deg,#4f7cff,#8b5cf6);border:1px solid rgba(255,255,255,.4);box-shadow:0 4px 12px var(--sd),inset 0 1px 0 rgba(255,255,255,.6)}
.sel.on .av{background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 55%),var(--g)}
.b{background:linear-gradient(180deg,rgba(255,255,255,.38),transparent 55%),var(--bl);border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 16px rgba(37,99,235,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.b.g{background:linear-gradient(180deg,rgba(255,255,255,.38),transparent 55%),var(--g);box-shadow:0 6px 16px rgba(31,168,85,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.b.o{background:linear-gradient(180deg,rgba(255,255,255,.38),transparent 55%),var(--or);box-shadow:0 6px 16px rgba(255,122,26,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.b.l{background:var(--gl);color:var(--tx);border:1px solid var(--gb);box-shadow:0 4px 12px var(--sd),inset 0 1px 0 var(--hl)}
input,select,textarea{background:var(--fi);border:1px solid var(--gb);box-shadow:inset 0 1px 3px rgba(30,50,110,.1)}
.ch span{background:var(--gl);border:1px solid var(--gb);box-shadow:0 2px 8px var(--sd),inset 0 1px 0 var(--hl)}
.bx .ch span,.card .ch span{background:var(--fi);box-shadow:none}
.ch span.on,.bx .ch span.on,.card .ch span.on{background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 60%),var(--dk);color:#fff;border-color:rgba(255,255,255,.3)}
.tg{background:var(--fi)}
.pg{background:var(--fi);border:1px solid var(--gb)}.pg i{background:linear-gradient(90deg,#34d399,#1fa855);box-shadow:0 0 10px #34d39988}
.gear{background:var(--gl);border:1px solid var(--gb);box-shadow:0 4px 14px var(--sd),inset 0 1px 0 var(--hl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.le{border-bottom:1px solid var(--fi)}
.m.a,.bx .m.a{background:var(--gl);border:1px solid var(--gb)}.bx .m.a{background:var(--fi)}
.m.u{background:linear-gradient(135deg,#3b6cf0,#6366f1);color:#fff}

nav button{color:var(--mu)}nav button.on{color:var(--tx)}
.pill{background:var(--pl);border:1px solid var(--gb);border-radius:26px;box-shadow:0 5px 16px var(--sd),inset 0 1px 0 #fff8}
.pill.sq{animation:sq .55s var(--sp)}
@keyframes sq{35%{scale:1.2 .88}100%{scale:1 1}}
#sh{background:rgba(20,30,60,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bx{background:linear-gradient(180deg,var(--sheen),transparent 28%),var(--gs);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);border:1px solid var(--gb);border-bottom:0;box-shadow:0 -10px 40px var(--sd),inset 0 1px 0 var(--hl)}
#ts{background:rgba(20,33,61,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.2)}
#sb{background:rgba(20,33,61,.74);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.22);visibility:hidden;opacity:0;transform:translateY(40px);transition:transform .5s var(--sp),opacity .3s,visibility 0s .5s}
#sb.on{visibility:visible;opacity:1;transform:none;transition:transform .5s var(--sp),opacity .3s,visibility 0s}
/* ===== Liquid glass v4: rápido y marcado ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
html[data-eff=light]{color-scheme:light;--bg:#eaf0fc;--c:#fff;--c2:#e4e9f2;--tx:#14213d;--mu:#6b7690;--dk:#14213d;--gl:rgba(255,255,255,.55);--gl2:rgba(255,255,255,.34);--gs:rgba(255,255,255,.78);--gb:rgba(255,255,255,.8);--hl:rgba(255,255,255,.95);--sd:rgba(40,60,130,.14);--sheen:rgba(255,255,255,.55);--fi:rgba(90,110,170,.13);--pl:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.4));--cg:rgba(255,255,255,.58);--cg2:rgba(255,255,255,.12);--ink:rgba(30,50,110,.16);--spec:.75;--o-op:.92}
html[data-eff=dark]{color-scheme:dark;--bg:#0a1020;--c:#172036;--c2:#222e4a;--tx:#e8eeff;--mu:#93a1c4;--dk:#2c3d72;--gl:rgba(40,54,92,.5);--gl2:rgba(40,54,92,.34);--gs:rgba(22,32,60,.8);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.26);--sd:rgba(0,0,0,.4);--sheen:rgba(255,255,255,.13);--fi:rgba(255,255,255,.09);--pl:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));--cg:rgba(255,255,255,.17);--cg2:rgba(255,255,255,.03);--ink:rgba(0,0,0,.45);--spec:.2;--o-op:.55}
#bg{position:fixed;inset:0;z-index:-3;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat}
body::before{display:none}
.orbs{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:var(--o-op)}
html:not([data-bg=aurora]):not([data-bg=malla]) .orbs{display:none}
.orbs i{position:absolute;border-radius:50%;will-change:transform;background:radial-gradient(circle at 30% 24%,#fffffff0 0,#ffffff00 26%),radial-gradient(circle at 50% 50%,var(--o1),var(--o2) 78%);box-shadow:inset -12px -16px 34px rgba(255,255,255,.3),inset 10px 12px 26px rgba(255,255,255,.55)}
.orbs i:nth-child(1){--o1:#8fb4ff;--o2:#3b6cf0;width:210px;height:210px;left:-70px;top:8%;animation:fl1 21s ease-in-out infinite alternate}
.orbs i:nth-child(2){--o1:#ffb0e0;--o2:#e0489f;width:150px;height:150px;right:-40px;top:22%;animation:fl2 17s ease-in-out infinite alternate}

.orbs i:nth-child(4){--o1:#ffd29a;--o2:#ff8a1f;width:130px;height:130px;left:12%;bottom:16%;animation:fl4 19s ease-in-out infinite alternate}
.orbs i:nth-child(5){--o1:#cdb8ff;--o2:#7c5cf0;width:110px;height:110px;left:44%;top:40%;animation:fl5 23s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate3d(90px,120px,0) scale(1.12)}}
@keyframes fl2{to{transform:translate3d(-110px,80px,0) scale(.88)}}

body.sh .orbs i{animation-play-state:paused}

function aiGoal(c){const o=outcome(c),x=xsell(c);if(o&&o.k=='cot'&&o.d<=21)return 'cot';if(o&&o.k=='nc'&&o.d<=10)return 'nc';if(score(c).kind=='repo')return 'repo';if(!buys(c).length)return x.sug.length&&x.have.length?'cross':'primer';return x.sug.length?'cross':'retomar'}

if(c.note)L.push('Lo que sé de él/ella: '+c.note);if(c.int)L.push('Le interesa: '+c.int);
if(b.length){const dl=Math.round((Date.now()-lastBuy(c))/864e5);L.push('Compras: '+b.length+' (total '+money(tot(c))+', promedio '+money(tot(c)/b.length)+'); la última hace '+dl+' días');const bi=b.map(l=>l.t).sort((a,z)=>a-z);if(bi.length>=2){const avg=Math.round((bi[bi.length-1]-bi[0])/864e5/(bi.length-1));if(avg>=3)L.push('Suele comprar cada ~'+avg+' días')}const bx=b.slice(0,3).map(l=>l.x).filter(Boolean).join('; ');if(bx)L.push('Detalle de compras recientes: '+bx.slice(0,160))}else L.push('Aún no tiene compras registradas');
if(x.have.length)L.push('Productos que ya mueve: '+famNames(x.have));if(x.sug.length)L.push('Venta cruzada sugerida: '+x.sug.map(s=>s.n+(s.promo?' (promo: '+s.promo.t+')':'')).join(', '));
if(o)L.push('Estado del seguimiento: '+o.n+' hace '+Math.round(o.d)+' días');const h=hx(c);if(h)L.push('Últimos contactos: '+h);if(pr)L.push('Promo vigente: '+pr.t);return L.join('\n')}
const aiPrompt=(c,goal,prev)=>'Escribe UN mensaje de WhatsApp para este cliente de mi bodega mayorista.\nObjetivo: '+GOALS[goal||aiGoal(c)]+'\n\nDATOS DEL CLIENTE:\n'+aiBrief(c)+'\n\nREGLAS: máximo 50 palabras. Tuteo cercano; usa el nombre de pila una sola vez, natural (si no hay nombre de persona, saluda al negocio sin inventar un nombre). Menciona algo específico de ÉL (lo que compra, su rubro o el último contacto) solo si calza. Ofrece UNA sola cosa concreta. Termina con una pregunta corta fácil de responder. No inventes precios, stock ni fechas. '+HUM+' Entrega SOLO el mensaje.'+(prev?'\nHaz una versión distinta a esta: '+prev.slice(0,140):'');

function bgSheet(keep){const b=LS('crm_bg','aurora'),th=LS('crm_theme','auto'),fx=LS('crm_fx','auto'),mv=LS('crm_bgm','1'),c=bgc(),old=keep&&$('#sh .bx'),sc=old?old.scrollTop:0,tm=LS('crm_bgth',''),dm=Math.round(parseFloat(LS('crm_bgdim','0.2'))*100)||0;

$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>🎨 Fondo y apariencia</h3><div class="bgg">${BGS.map(([k,n,i])=>`<div class="bgi ${b==k?'on':''}" onclick="setBg('${k}')"><div class="pv bg-${k}"${k=='color'?` style="--bc1:${c[0]};--bc2:${c[1]}"`:k=='foto'&&tm?` style="background-image:url('${tm}');background-size:cover"`:''}><span>${i}</span></div><small>${n}</small></div>`).join('')}</div>${b=='color'?`<label>Elige dos colores</label><div class="r"><input type="color" id="bc1" value="${c[0]}" oninput="setBgC()"><input type="color" id="bc2" value="${c[1]}" oninput="setBgC()"></div>`:''}${b=='foto'?`<label class="b l fil" style="display:block;text-align:center;margin:8px 0">📷 Elegir foto de la galería<input type="file" accept="image/*" onchange="bgPhoto(this)" hidden></label><label>Oscurecer foto: <b id="dimv">${dm}%</b></label><input type="range" min="0" max="70" value="${dm}" oninput="setDim(this.value)">`:''}<label>Tema</label>${ch([['auto','Auto'],['light','Claro'],['dark','Oscuro']],th,'setTheme')}<label>Movimiento del fondo</label>${ch([['1','Suave'],['0','Quieto']],mv,'setMove')}<label>Rendimiento y efectos</label>${ch([['auto','Automático'],['2','Completo'],['1','Equilibrado'],['0','Ahorro']],fx,'setFxm')}<small>Equilibrado es el más fluido con buen aspecto. Completo suma desenfoques y brillos animados. Ahorro quita desenfoques y movimiento si tu teléfono va lento.</small></div>`;
openS();if(keep)$('#sh').classList.add('re');const nb=$('#sh .bx');if(nb&&sc)nb.scrollTop=sc}
function setBg(k){LSS('crm_bg',k);applyLook();bgSheet(1)}
function setTheme(k){LSS('crm_theme',k);applyLook();bgSheet(1)}
function setMove(v){LSS('crm_bgm',v);applyLook();bgSheet(1)}
function setFxm(v){LSS('crm_fx',v);if(v!='auto')LSS('crm_fxp','');applyLook();bgSheet(1);toast({auto:'Rendimiento automático','2':'Efectos completos','1':'Modo equilibrado','0':'Modo ahorro'}[v]);if(v=='auto')fxProbe()}
function setBgC(){LSS('crm_bgc',JSON.stringify([$('#bc1').value,$('#bc2').value]));applyLook();const p=document.querySelector('.pv.bg-color');if(p){p.style.setProperty('--bc1',$('#bc1').value);p.style.setProperty('--bc2',$('#bc2').value)}}
function setDim(v){LSS('crm_bgdim',(v/100).toFixed(2));const d=$('#dimv');if(d)d.textContent=v+'%';applyLook()}
function bgPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
rd.onload=()=>{const im=new Image();im.onerror=()=>toast('No pude leer esa imagen');
im.onload=()=>{const mk=M=>{const r=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*r));cv.height=Math.max(1,Math.round(im.height*r));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv};
try{let q=.78,u=mk(1280).toDataURL('image/jpeg',q);while(u.length>1.4e6&&q>.35){q-=.12;u=mk(1280).toDataURL('image/jpeg',q)}localStorage.setItem('crm_bgimg',u);localStorage.setItem('crm_bgth',mk(150).toDataURL('image/jpeg',.6))}catch(x){return toast('No pude guardar esa foto. Prueba con otra')}
LSS('crm_bg','foto');applyLook();bgSheet(1);toast('Fondo actualizado')};im.src=rd.result};rd.readAsDataURL(f);try{inp.value=''}catch(x){}}

function burst(el){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};for(let i=0;i<14;i++){const f=document.createElement('div');f.className='fx';f.textContent=['🎉','✨','⭐','💚','🔥'][i%5];f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height/2)+'px';f.style.setProperty('--x',(Math.random()*240-120)+'px');f.style.setProperty('--y',(-Math.random()*200-40)+'px');f.style.setProperty('--r',(Math.random()*360-180)+'deg');document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}}
function countUp(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,m=el.dataset.m,t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/800),v=n*(1-Math.pow(1-k,3));el.textContent=m?money(v):Math.round(v);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
(function(){let y0=0,dy=0,dr=null;const sh=$('#sh');sh.addEventListener('touchstart',ev=>{const g=ev.target.closest('.gr');if(g){dr=g.parentElement;y0=ev.touches[0].clientY;dy=0;dr.style.transition='none'}},{passive:true});sh.addEventListener('touchmove',ev=>{if(dr){dy=Math.max(0,ev.touches[0].clientY-y0);dr.style.transform='translateY('+dy+'px)'}},{passive:true});sh.addEventListener('touchend',()=>{if(dr){dr.style.transition='';dr.style.transform='';if(dy>110){CPI=-1;closeS()}dr=null}})})();

let PREV=-1;
function go(t){cur=t;const ix=TABS.findIndex(x=>x[0]==t),same=ix==PREV,dir=PREV<0||same?0:Math.sign(ix-PREV);PREV=ix;
$('#hd').innerHTML=TABS[ix][2]+'<button class="gear" onclick="cfg()">⚙️</button><button class="gear" onclick="bgSheet()">🎨</button>';
$('#mn').innerHTML='<div class="v'+(same?' rf':'')+'" style="--dx:'+dir*38+'px">'+TABS[ix][3]()+'</div>';if(!same)$('#mn').scrollTop=0;
const nv=$('#nv');if(!nv.children.length)nv.innerHTML='<i class="pill"></i>'+TABS.map(x=>`<button onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
[...nv.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i==ix));{const pl=nv.querySelector('.pill');pl.style.transform='translateX('+ix*100+'%)';if(!same){pl.classList.remove('sq');pl.offsetWidth;pl.classList.add('sq')}}
if(t!='cli'&&SELM){SELM=false;SEL.clear()}$('#sb').className=t=='cli'&&SELM?'on':'';if(t=='cli'&&SELM)selBar();
if(t=='cli')fl();if(t=='pro')loadThumbs();if(t=='hoy'&&!same)countUp();if(t=='ia'){drawChat();$('#qi').onkeydown=ev=>{if(ev.key=='Enter')sendQ()}}}

applyLook();fxProbe();
document.addEventListener('pointerdown',ev=>{const t=ev.target.closest&&ev.target.closest('.card,.b');if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty('--mx',((ev.clientX-r.left)/r.width*100)+'%');t.style.setProperty('--my',((ev.clientY-r.top)/r.height*100)+'%')},{passive:true});
go('hoy');
