<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bodega CRM</title><style>
:root{--bg:#edf0f5;--c:#fff;--c2:#e4e9f2;--tx:#14213d;--mu:#6b7690;--g:#1fa855;--bl:#2563eb;--or:#ff7a1a;--rd:#d93a3a;color-scheme:light dark;--dk:#14213d;--sp:cubic-bezier(.34,1.45,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:none;color:var(--tx);font:15px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
html{background:var(--bg)}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px;font-size:22px;font-weight:800;letter-spacing:-.4px}
main{flex:1;overflow-y:auto;padding:4px 14px 100px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
h3{margin:18px 2px 6px;font-size:16px}
@keyframes in{from{opacity:0;transform:translate(var(--dx,0px),14px) scale(.985)}}
.v{animation:in .38s var(--sp)}
.card{position:relative;border:0;border-radius:18px;padding:12px;margin:8px 0;animation:in .42s var(--sp) both;transition:transform .16s var(--sp);background:radial-gradient(130% 80% at 0% 0%,rgba(255,255,255,var(--spec)),transparent 58%),linear-gradient(160deg,var(--cg),var(--cg2) 45%,var(--cg2) 70%,var(--cg)),var(--gl2);box-shadow:0 8px 22px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px rgba(255,255,255,.32),inset 0 -12px 18px -14px rgba(120,150,255,.28)}
.card:active{transform:scale(.975)}
.rf,.rf .card,.rf .le,.nf .card{animation:none!important}
.r{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.75),transparent 42%),linear-gradient(135deg,#4f7cff,#8b5cf6);border:1px solid rgba(255,255,255,.4);box-shadow:0 5px 12px var(--sd),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -4px 8px rgba(40,20,120,.35)}
.f{flex:1;min-width:0}.f b{display:block}
small,.mu{color:var(--mu);display:block;font-size:12.5px;line-height:1.35}
.rd{color:var(--rd);font-weight:700}
.ac{display:flex;gap:8px;margin-top:10px}
.b{flex:1;border:0;border-radius:14px;padding:12px 8px;font:700 14px system-ui;color:#fff;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 50%,rgba(0,0,0,.1)),var(--bl);box-shadow:0 8px 18px rgba(37,99,235,.38),inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.3);text-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .1s,filter .12s}
.b::before{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:12px 12px 20px 20px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.04));pointer-events:none}
.b:active{transform:scale(.94);filter:brightness(.92)}
.b.g{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 50%,rgba(0,0,0,.1)),var(--g);box-shadow:0 8px 18px rgba(31,168,85,.38),inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.3)}
.b.o{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 50%,rgba(0,0,0,.1)),var(--or);box-shadow:0 8px 18px rgba(255,122,26,.38),inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.3)}
.b.l{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 55%),var(--gl);color:var(--tx);text-shadow:none;box-shadow:0 5px 14px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--gb)}
.b.l::before{opacity:.4}
input,select,textarea{width:100%;border:0;color:var(--tx);border-radius:12px;padding:12px;margin:5px 0;font:15px system-ui;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(255,255,255,.12)),var(--fi);box-shadow:inset 0 2px 5px var(--ink),inset 0 -1px 0 rgba(255,255,255,.6),inset 0 0 0 1px var(--gb);transition:box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:inset 0 2px 5px var(--ink),0 0 0 3px rgba(79,124,255,.45),inset 0 0 0 1px rgba(255,255,255,.6)}
textarea{min-height:90px;resize:none}
label{font-size:13px;color:var(--mu)}
.ch{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.ch span{padding:8px 14px;border-radius:20px;white-space:nowrap;font-weight:600;transition:.18s;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08)),var(--gl);box-shadow:0 3px 10px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--gb);border:0}
.bx .ch span,.card .ch span{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.04)),var(--fi);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--gb)}
.ch span.on,.bx .ch span.on,.card .ch span.on{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.02) 60%),var(--dk);color:#fff;box-shadow:0 5px 14px var(--sd),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.3);animation:pop .32s var(--sp)}
@keyframes pop{from{transform:scale(.9)}}
.st{display:flex;gap:8px;margin-top:6px}
.st div{flex:1;color:#fff;border-radius:16px;padding:12px;font-size:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 22px var(--sd),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -8px 14px -8px rgba(0,0,0,.18)}
.st div:nth-child(1){background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%),linear-gradient(135deg,#3b6cf0,#6f9bff)}
.st div:nth-child(2){background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%),linear-gradient(135deg,#0f9d58,#3ddc97)}
.st div:nth-child(3){background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%),linear-gradient(135deg,#ff7a1a,#ffb25b)}
.st b{display:block;font-size:21px}
.pg{height:8px;border-radius:8px;background:var(--fi);margin:8px 0;overflow:hidden;box-shadow:inset 0 2px 4px var(--ink),inset 0 0 0 1px var(--gb)}
.pg i{display:block;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 55%),linear-gradient(90deg,#34d399,#1fa855);box-shadow:0 0 12px #34d399aa,inset 0 1px 0 rgba(255,255,255,.7);transition:width .45s;animation:grow .7s var(--sp) both}
@keyframes grow{from{width:0}}
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:32px;display:flex;padding:6px;-webkit-backdrop-filter:blur(22px) saturate(210%) brightness(1.06);backdrop-filter:blur(22px) saturate(210%) brightness(1.06);background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.06) 50%,rgba(255,255,255,.28)),var(--gl2);border:0;box-shadow:0 14px 34px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 -10px 18px -12px rgba(255,255,255,.55);will-change:transform}
nav::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(140,190,255,.45),rgba(255,150,225,.5),rgba(255,255,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
nav::after{content:'';position:absolute;left:12%;right:12%;top:2px;height:38%;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);opacity:.6;pointer-events:none;z-index:2}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;border-radius:18px;font:600 11px system-ui;transition:.2s;position:relative;z-index:1}
nav button span{display:block;font-size:20px;transition:transform .22s}
nav button.on{color:var(--tx)}nav button.on span{transform:translateY(-2px) scale(1.14)}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:26px;background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.95),rgba(255,255,255,.25) 62%),var(--pl);overflow:hidden;box-shadow:0 6px 16px var(--sd),inset 0 1.5px 0 #fffc,inset 0 0 0 1px var(--gb);transition:transform .42s var(--sp);will-change:transform}
.pill.sq{animation:sq .48s var(--sp)}
@keyframes sq{35%{scale:1.16 .9}100%{scale:1 1}}
#sh{position:fixed;inset:0;background:rgba(10,18,40,.36);opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end;z-index:20}
#sh.on{opacity:1;pointer-events:auto}
.bx{width:100%;max-height:90dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(100%);transition:transform .42s var(--sp);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);background:radial-gradient(120% 40% at 0% 0%,rgba(255,255,255,calc(var(--spec) + .1)),transparent 60%),var(--gs);box-shadow:0 -12px 40px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--gb)}
#sh.on .bx{transform:none}
.bx .card,.card .card{background:var(--gl2);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--gb)}
.gr{width:100%;height:26px;position:relative}
.gr::before{content:'';position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(160,175,205,.7));box-shadow:0 1px 3px var(--sd),inset 0 1px 0 #fff}
#ts{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:rgba(20,33,61,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;max-width:85%;z-index:30;box-shadow:0 12px 28px rgba(10,20,50,.35),inset 0 1.5px 0 rgba(255,255,255,.3)}
#ts.on{opacity:1;transform:translate(-50%,0)}
#chat{max-height:52dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.m{padding:10px 12px;border-radius:16px;margin:6px 0;max-width:90%;line-height:1.4}
.m.u{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%),linear-gradient(135deg,#3b6cf0,#7c6cf5);color:#fff;margin-left:auto;box-shadow:0 7px 16px rgba(59,108,240,.35),inset 0 1.5px 0 rgba(255,255,255,.6);transform-origin:100% 100%;animation:bub .32s var(--sp)}
.m.a,.bx .m.a{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08)),var(--gl);box-shadow:0 5px 14px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--gb);transform-origin:0 100%;animation:bub .32s var(--sp)}
.bx .m.a{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.04)),var(--fi);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--gb)}
@keyframes bub{from{opacity:0;transform:translateY(10px) scale(.92)}}
.bar{display:flex;gap:6px}.bar input{flex:1}.bar button{flex:none;width:52px}
.gear{float:right;border:0;background:var(--gl);border-radius:14px;width:40px;height:40px;font-size:18px;box-shadow:0 6px 16px var(--sd),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--gb)}
.gear+.gear{margin-right:8px}
.le{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--fi);animation:in .26s both}.le>span{font-size:20px}.le i{color:var(--mu);font-style:normal;padding:4px 8px}
.th{display:none;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:6px 0}
.wb{background:#d9fdd3;color:#111;border-radius:14px 14px 14px 4px;padding:10px 12px;white-space:pre-wrap;line-height:1.4;font-size:14px;margin:8px 0;word-break:break-word}
.out{animation:out .35s ease forwards;overflow:hidden}
@keyframes out{to{opacity:0;transform:translateX(70px);max-height:0;padding-top:0;padding-bottom:0;margin:0}}
.fx{position:fixed;pointer-events:none;font-size:22px;z-index:99;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
.tg{display:inline-block;background:var(--fi);color:var(--tx);border-radius:10px;padding:1px 8px;margin-right:4px;font-weight:700;box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--gb)}
.sel.on{outline:2px solid var(--g)}.sel .av{transition:.2s}.sel.on .av{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.75),transparent 42%),var(--g)}
#sb{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:rgba(20,33,61,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;border-radius:20px;padding:10px;display:flex;gap:8px;align-items:center;visibility:hidden;opacity:0;transform:translateY(40px);transition:transform .42s var(--sp),opacity .25s,visibility 0s .42s;z-index:5;box-shadow:0 12px 28px rgba(10,20,50,.35),inset 0 1.5px 0 rgba(255,255,255,.3)}
#sb.on{visibility:visible;opacity:1;transform:none;transition:transform .42s var(--sp),opacity .25s,visibility 0s}
html[data-eff=light]{color-scheme:light;--bg:#eaf0fc;--c:#fff;--c2:#e4e9f2;--tx:#14213d;--mu:#6b7690;--dk:#14213d;--gl:rgba(255,255,255,.58);--gl2:rgba(255,255,255,.38);--gs:rgba(255,255,255,.82);--gb:rgba(255,255,255,.8);--hl:rgba(255,255,255,.95);--sd:rgba(40,60,130,.13);--sheen:rgba(255,255,255,.55);--fi:rgba(90,110,170,.13);--pl:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.4));--cg:rgba(255,255,255,.6);--cg2:rgba(255,255,255,.14);--ink:rgba(30,50,110,.15);--spec:.75;--o-op:.88}
html[data-eff=dark]{color-scheme:dark;--bg:#0a1020;--c:#172036;--c2:#222e4a;--tx:#e8eeff;--mu:#93a1c4;--dk:#2c3d72;--gl:rgba(40,54,92,.52);--gl2:rgba(40,54,92,.36);--gs:rgba(22,32,60,.84);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.26);--sd:rgba(0,0,0,.4);--sheen:rgba(255,255,255,.13);--fi:rgba(255,255,255,.09);--pl:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));--cg:rgba(255,255,255,.17);--cg2:rgba(255,255,255,.03);--ink:rgba(0,0,0,.45);--spec:.2;--o-op:.5}
#bg{position:fixed;inset:0;z-index:-3;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat}
.orbs{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:var(--o-op)}
html:not([data-bg=aurora]):not([data-bg=malla]) .orbs{display:none}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 24%,#fffffff0 0,#ffffff00 26%),radial-gradient(circle at 50% 50%,var(--o1),var(--o2) 78%);box-shadow:inset -10px -14px 28px rgba(255,255,255,.28),inset 8px 10px 22px rgba(255,255,255,.5)}
.orbs i:nth-child(1){--o1:#8fb4ff;--o2:#3b6cf0;width:210px;height:210px;left:-70px;top:8%;animation:fl1 22s ease-in-out infinite alternate}
.orbs i:nth-child(2){--o1:#ffb0e0;--o2:#e0489f;width:150px;height:150px;right:-40px;top:22%;animation:fl2 18s ease-in-out infinite alternate}
.orbs i:nth-child(3){--o1:#8ff0d0;--o2:#10b981;width:230px;height:230px;right:-90px;bottom:6%;animation:fl3 26s ease-in-out infinite alternate}
.orbs i:nth-child(4){--o1:#ffd29a;--o2:#ff8a1f;width:130px;height:130px;left:12%;bottom:16%;animation:fl4 20s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate3d(85px,110px,0)}}
@keyframes fl2{to{transform:translate3d(-95px,75px,0)}}
@keyframes fl3{to{transform:translate3d(-55px,-115px,0)}}
@keyframes fl4{to{transform:translate3d(105px,-65px,0)}}
body.sh .orbs i,body.scr .orbs i,body.calm .orbs i{animation-play-state:paused}
body.calm .orbs i{animation:none}
body.fx2 .card{-webkit-backdrop-filter:blur(16px) saturate(200%);backdrop-filter:blur(16px) saturate(200%)}
body.fx2 .bx .card,body.fx2 .card .card{-webkit-backdrop-filter:none;backdrop-filter:none}
body.fx2 #sh{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.lite .orbs{display:none}
.lite nav,.lite .bx,.lite #ts,.lite #sb{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--gs)}
.lite .card,.lite .b,.lite .ch span{animation-duration:.16s}
button,.card,.ch span,nav button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#L .card{content-visibility:auto;contain-intrinsic-size:auto 148px}
.dots{display:inline-flex;gap:5px;padding:5px 2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:dot 1.1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.bars{display:flex;gap:8px;align-items:flex-end;height:96px;margin:4px 0 10px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.bars i{display:block;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 55%),linear-gradient(180deg,#7aa7ff,#3b6cf0);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 6px 12px rgba(59,108,240,.3);transform-origin:bottom;animation:rise .75s var(--sp) both}
.bars div:last-child i{background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 55%),linear-gradient(180deg,#4be0a0,#1fa855);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 6px 12px rgba(31,168,85,.35)}
.bars small{margin-top:4px;text-align:center}
@keyframes rise{from{transform:scaleY(0)}}
.bgg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}.bgi{text-align:center;transition:transform .18s var(--sp)}.bgi:active{transform:scale(.94)}
.pv{height:84px;border-radius:18px;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 14px var(--sd),inset 0 0 0 1px rgba(255,255,255,.45);transition:box-shadow .22s,transform .22s var(--sp)}
.bgi.on .pv{box-shadow:0 0 0 3px #4f7cff,0 6px 16px var(--sd);transform:scale(1.04)}.bgi small{margin-top:5px;text-align:center}
input[type=color]{height:46px;padding:4px}input[type=range]{padding:0;height:30px;box-shadow:none;background:none}.fil{cursor:pointer}
.bg-aurora{background:radial-gradient(38% 30% at 15% 12%,#7aa7ffaa,transparent 70%),radial-gradient(34% 28% at 88% 22%,#ff9ad5aa,transparent 70%),radial-gradient(40% 32% at 72% 88%,#7ce6c4aa,transparent 70%),radial-gradient(30% 26% at 8% 80%,#ffc78aaa,transparent 70%),#eaf0fc}html[data-eff=dark] .bg-aurora{background:radial-gradient(38% 30% at 15% 12%,#5b86f055,transparent 70%),radial-gradient(34% 28% at 88% 22%,#e0489f44,transparent 70%),radial-gradient(40% 32% at 72% 88%,#10b98144,transparent 70%),radial-gradient(30% 26% at 8% 80%,#ff8a1f33,transparent 70%),#0a1020}

html[data-bg=oceano][data-eff=light]{--bg:#a8dbf2;--dk:#0e4a63}html[data-bg=oceano][data-eff=dark]{--bg:#06202e;--dk:#14607a}
.bg-atardecer{background:radial-gradient(55% 40% at 85% 10%,#ffd9a8bb,transparent 70%),linear-gradient(170deg,#ffe3d1 0%,#ffc2d4 45%,#cdb4ff 100%)}html[data-eff=dark] .bg-atardecer{background:radial-gradient(55% 40% at 85% 10%,#ff8a6a44,transparent 70%),linear-gradient(170deg,#2a1230 0%,#3d1a45 50%,#1f1b4d 100%)}

function resumen(){const t=new Date(),m6=[];for(let i=5;i>=0;i--){const a=new Date(t.getFullYear(),t.getMonth()-i,1),b=new Date(t.getFullYear(),t.getMonth()-i+1,1);m6.push({l:a.toLocaleDateString('es-CL',{month:'short'}).replace('.',''),v:S.c.reduce((n,c)=>n+buys(c).filter(l=>l.t>=a.getTime()&&l.t<b.getTime()).reduce((x,l)=>x+l.m,0),0)})}
const all=S.c.flatMap(c=>buys(c));if(!all.length)return '';
const mx=Math.max(...m6.map(x=>x.v),1),d30=Date.now()-30*864e5,r30=all.filter(l=>l.t>=d30),tk=r30.length?r30.reduce((a,l)=>a+l.m,0)/r30.length:0;
const top=S.c.filter(c=>tot(c)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,3);
const risk=S.c.map(c=>{const b=buys(c).map(l=>l.t).sort((a,z)=>a-z);if(b.length<2)return null;let q=0;for(let i=1;i<b.length;i++)q+=(b[i]-b[i-1])/864e5;const avg=q/(b.length-1),dl=(Date.now()-b[b.length-1])/864e5;return avg>=3&&dl>avg*1.5?{c,dl:Math.round(dl),avg:Math.round(avg)}:null}).filter(Boolean).sort((a,b)=>tot(b.c)-tot(a.c)).slice(0,3);
return `<h3>📈 Resumen de ventas</h3><div class="card"><div class="bars">${m6.map(x=>`<div><i style="height:${Math.max(4,x.v/mx*100)}%"></i><small>${x.l}</small></div>`).join('')}</div><small>Ticket promedio (30 días): <b>${money(tk)}</b> · ${r30.length} compras</small>${top.length?'<small style="margin-top:6px">🏆 Mejores: '+top.map(c=>'<span class="tg" onclick="sheet('+c.id+',\'h\')">'+e(pname(c)||c.name)+' '+money(tot(c))+'</span>').join('')+'</small>':''}${risk.length?'<small style="margin-top:6px">⚠️ En riesgo (se atrasaron): '+risk.map(x=>'<span class="tg" onclick="sheet('+x.c.id+',\'h\')">'+e(pname(x.c)||x.c.name)+' · '+x.dl+' d (suele cada '+x.avg+')</span>').join('')+'</small>':''}</div>`}

perfumeria:{n:'perfumería',k:/perfum|shampoo|desodorante|cosm[eé]tic|crema/i,x:['aseo','papeleria']},
abarrotes:{n:'abarrotes (arroz, azúcar, aceite)',k:/abarrote|arroz|az[uú]car|fideo|aceite|harina|legumbre|conserva/i,x:['bebidas','lacteos','snacks']},

const famsIn=t=>Object.keys(FAM).filter(f=>FAM[f].k.test(t||''));
const famHave=c=>memo('fh_'+c.id,()=>famsIn((CATS[c.cat]||'')+' '+(c.note||'')+' '+buys(c).map(l=>l.x).join(' ')));
const xsHave=()=>memo('xsh',()=>{const m={};S.c.forEach(c=>{m[c.id]=famHave(c)});return m});
const promoOf=f=>S.p.find(p=>FAM[f].k.test(p.t+' '+p.x));
function xsell(c,H){return memo('xs_'+c.id,()=>{H=H||xsHave();const have=H[c.id]||[],int=famsIn(c.int),out=[];
Object.keys(FAM).forEach(f=>{if(have.includes(f))return;let s=0;const why=[];
have.forEach(g=>{if(FAM[g].x.includes(f))s+=3});
if(have.length){const peers=S.c.filter(o=>o.id!=c.id&&(H[o.id]||[]).some(g=>have.includes(g))),w=peers.filter(o=>(H[o.id]||[]).includes(f)).length;if(peers.length>=3&&w){s+=Math.round(w/peers.length*6);why.push(w+' de '+peers.length+' clientes parecidos ya lo llevan')}}
if(int.includes(f)){s+=6;why.unshift('Le interesa')}
const pr=promoOf(f);if(pr){s+=2;why.push('Hay promo: '+pr.t)}
if(s>0)out.push({k:f,n:FAM[f].n,s,why,promo:pr})});
let L=out.sort((a,b)=>b.s-a.s);
if(!have.length){L=Object.keys(FAM).map(f=>({f,n:S.c.filter(o=>(H[o.id]||[]).includes(f)).length})).sort((a,b)=>b.n-a.n).filter(x=>x.n).slice(0,2).map(x=>({k:x.f,n:FAM[x.f].n,s:1,why:['Lo más comprado en tu cartera'],promo:promoOf(x.f)}))}
return {have,sug:L.slice(0,3)}})}

function xsMsg(id){const c=cl(id),x=xsell(c),a=x.sug.slice(0,2).map(s=>s.n),pr=(x.sug.find(s=>s.promo)||{}).promo;

function xsHoy(){const H=xsHave(),a=S.c.filter(c=>norm(c.phone)).map(c=>({c,x:xsell(c,H)})).filter(o=>o.x.sug.length&&o.x.have.length).sort((a,b)=>tot(b.c)-tot(a.c)||b.x.sug[0].s-a.x.sug[0].s).slice(0,3);if(!a.length)return '';
return `<h3>🧩 Oportunidades de venta cruzada</h3>${a.map((o,i)=>`<div class="card" style="animation-delay:${i*35}ms"><div class="r" onclick="sheet(${o.c.id},'h')"><div class="av">${e(o.c.name[0])}</div><div class="f"><b>${e(o.c.name)}</b><small>Compra: ${e(famNames(o.x.have.slice(0,2)))}</small><small>👉 Ofrécele: <b>${o.x.sug.slice(0,2).map(s=>s.n)).join(' y ')}</b></small></div></div><div class="ac"><button class="b l" onclick="aiMsg(${o.c.id},'cross')">✨ Mensaje con IA</button><button class="b g" onclick="act('w',${o.c.id},xsMsg(${o.c.id}))">💬 Enviar</button></div></div>`).join('')}`}

const GOALS={cross:'Venta cruzada: ofrecerle productos complementarios a lo que ya compra',repo:'Reposición: preguntarle cómo está de stock antes de que compre en otro lado',cot:'Seguimiento de cotización: ayudarle a decidir y coordinar entrega',nc:'Reintentar contacto: no contestó el llamado, dejarle un mensaje corto',retomar:'Reactivar: saludarlo después de un tiempo y saber qué está necesitando',primer:'Primer contacto: presentarse corto y ofrecer precios mayoristas',promo:'Contarle la promoción vigente como un dato directo para su negocio'};
function aiGoal(c){const o=outcome(c),x=xsell(c);if(o&&o.k=='cot'&&o.d<=21)return 'cot';if(o&&o.k=='nc'&&o.d<=10)return 'nc';if(score(c).kind=='repo')return 'repo';if(!buys(c).length)return x.sug.length&&x.have.length?'cross':'primer';return x.sug.length?'cross':'retomar'}
function aiBrief(c){const b=buys(c),x=xsell(c),o=outcome(c),pr=S.p[0],pn=pname(c),bn=bname(c),L=[pn?'Nombre de la persona para saludar: '+pn:bn?'No hay nombre de persona; es el negocio "'+bn+'" (saluda sin inventar nombre de pila)':'Saluda sin inventar nombre','Ficha: '+c.name,'Rubro/Categoría: '+(CATS[c.cat]||'comercio')];
if(c.note)L.push('Notas reales del cliente: '+c.note);if(c.int)L.push('Productos que le interesan: '+c.int);
if(b.length){const dl=Math.round((Date.now()-lastBuy(c))/864e5);L.push('Compras registradas: '+b.length+' (total '+money(tot(c))+', última hace '+dl+' días)');const bi=b.map(l=>l.t).sort((a,z)=>a-z);if(bi.length>=2){const avg=Math.round((bi[bi.length-1]-bi[0])/864e5/(bi.length-1));if(avg>=3)L.push('Frecuencia de compra: cada ~'+avg+' días')}}
if(x.have.length)L.push('Lo que suele llevar: '+famNames(x.have));if(x.sug.length)L.push('Le podría servir sumar: '+x.sug.map(s=>s.n+(s.promo?' (en oferta: '+s.promo.t+')':'')).join(', '));
if(o)L.push('Último seguimiento: '+o.n+' hace '+Math.round(o.d)+' días');const h=hx(c);if(h)L.push('Historial reciente: '+h);if(pr)L.push('Oferta activa en bodega: '+pr.t);return L.join('\n')}
const aiPrompt=(c,goal,prev)=>'Redacta UN mensaje de WhatsApp para este cliente de mi distribuidora/bodega mayorista.\nMotivo: '+GOALS[goal||aiGoal(c)]+'\n\nDATOS REALES:\n'+aiBrief(c)+'\n\nREGLAS ESTRICTAS: máximo 45 palabras. Usa el nombre de la persona una sola vez de forma natural (si es empresa sin nombre de persona, di algo como "Hola, ¿cómo están?" o menciona su local sin inventar nombres). Incluye UN detalle real de su ficha (su rubro, comuna o lo que suele comprar) sin que suene a base de datos. Cierra con una pregunta corta y casual. No inventes precios ni fechas. '+HUM+' Entrega SOLO el mensaje.'+(prev?'\nCambia por completo el inicio y las palabras respecto a este borrador anterior: '+prev.slice(0,140):'');

const BIZ_PURE=/^(gsm|jamyl|dilum|agrolatino|tres\s+hermanos|tres\s+mundos|santa\s+econom[ií]a|santa\s+flora|santa\s+juana|comercial\s+ath|comercial\s+nietos|comercializadora\s+weisz|limpieza\s+ays|clientes\s+almaceneros|dist\.|distribuidora)/i;
const BIZ_DROP=/\b(spa|ltda\.?|eirl|s\.?a\.?|comercializadora|comercial|minimarket|almac[eé]n|almaceneros|distribuidora|dist\.?|comer\.?|local\s*\d*|restaurant|construcciones|limpieza|panader[ií]a|carnicer[ií]a|l2p|ath|ays)\b/gi;
function pname(c){return memo('pn_'+c.id,()=>{const raw=String(c.name||'').trim();if(!raw)return '';
const pm=raw.match(/\(([^)]+)\)/);if(pm){const p=pm[1].replace(BIZ_DROP,'').trim();if(p&&!/^(panader|carnicer|rancagua|melipilla|feria|playa)/i.test(p))return p.split(/\s+/)[0]}
const sra=raw.match(/^(sra\.?|don|doña)\s+([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/i);if(sra)return (sra[1].replace(/\.$/,'')+'. '+sra[2]).replace(/^don\.\s*/i,'Don ').replace(/^doña\.\s*/i,'Doña ').replace(/^sra\.\s*/i,'Sra. ');
const pre=raw.split('/')[0].replace(/\([^)]*\)/g,'').trim();
if(BIZ_PURE.test(pre))return '';
const cln=pre.replace(BIZ_DROP,'').replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ\s-]/g,' ').trim();
if(!cln)return '';
const tok=cln.split(/\s+/)[0].split('-')[0];
return tok.length>=2?tok:''})}
function bname(c){const raw=String(c.name||'').replace(/\([^)]*\)/g,'').replace(/\b(spa|ltda\.?|eirl|dist\.?\s*y\s*comer\.?)\b/gi,'').trim();return raw.slice(0,28)}
const hi=c=>{const n=pname(c);return n?'Hola '+n:'Hola'},rnd=a=>a[Math.floor(Math.random()*a.length)];

const LV={

function autoCad(c){if(+c.cad>0)return +c.cad;const nt=(c.note||'')+' '+(c.int||'');
if(/cada\s+semana|semanal|todos\s+los\s+lunes|viene\s+los\s+lunes|pr[oó]ximo\s+lunes/i.test(nt))return 7;
if(/quincenal/i.test(nt))return 15;
if(/preferir\s+llamar|importante\s+llamar|llamar\s+y\s+escribir/i.test(nt))return 10;
const b=buys(c).map(l=>l.t).sort((a,z)=>a-z);if(b.length>=2){const v=(b[b.length-1]-b[0])/864e5/(b.length-1);if(v>=3)return Math.round(Math.min(45,Math.max(5,v)))}
return c.vip?Math.max(5,Math.round(S.nv.d/2)):S.nv.d}
function NIV(c){return memo('nv_'+c.id,()=>{const N=S.nv,ks=N.w?['llamada','whatsapp','campaña']:['llamada'],t=lkT(c,ks),cad=autoCad(c);
if(!t)return {k:'nu',p:10,r:95+(c.vip?3:0)+(/llamar/i.test(c.note)?2:0),cad,dd:999,txt:(N.w?'Sin contacto':'Sin llamar')+' · cada '+cad+' d'};
const d=Math.max(0,(Date.now()-t)/864e5),r=d/cad,dd=Math.floor(d),left=Math.max(0,Math.ceil(cad-d));
const k=r<.55?'ok':r<.9?'pr':r<1.35?'to':'mu';
const p=k=='ok'?Math.round(100-r*45):k=='pr'?Math.round(72-(r-.55)*85):k=='to'?Math.round(40-(r-.9)*55):Math.max(8,Math.round(16-(r-1.35)*8));
const sub=dd<1?'hoy':k=='ok'?'hace '+dd+' d · en '+left+' d':k=='pr'?'hace '+dd+' d (en '+left+' d)':k=='to'?'hace '+dd+' d · llamar hoy':'hace '+dd+' d sin llamar';
return {k,p:Math.max(8,Math.min(100,p)),r,cad,dd,txt:LV[k][2]+' · '+sub}})}
const lvH=c=>{const v=NIV(c),L=LV[v.k],u=v.k=='to'||v.k=='mu'||v.k=='nu';return `<div class="lvw${u?' urg':''}" style="--lc:${L[0]};--lt:${L[1]}"><div class="lv"><i style="width:${v.p}%"></i></div><span class="lt"><i class="ldot"></i>${v.txt}</span></div>`};

function humanize(t,c){t=String(t||'').replace(/\r/g,'').replace(/^(claro|por supuesto|aqu[ií]\s+tienes|mensaje|opci[oó]n|borrador)[^\n]{0,45}:\s*\n+/i,'').replace(/\s*[—–]\s*/g,', ').replace(/¡/g,'').replace(/!{2,}/g,'!').replace(/espero\s+que\s+(est[eé]s|te\s+encuentres)\s+(muy\s+|s[uú]per\s+)?bien[,.!]?\s*/gi,'').replace(/no\s+dudes\s+en\s+[^\n.!]*/gi,'').replace(/quedo\s+atento[^\n.!]*/gi,'').replace(/[👋✨🚀💥🔥🎯🙌]\uFE0F?/gu,'');
let k=0;t=t.replace(/\p{Extended_Pictographic}\uFE0F?/gu,m=>++k>1?'':m).replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/ {2,}/g,' ').trim();
const n=pname(c),bn=bname(c);
if(t&&n&&!t.toLowerCase().includes(n.toLowerCase().split(' ').pop())){const low=/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t;t='Hola '+n+', '+low}
else if(t&&!n&&bn&&!/hola|buenas|buen d/i.test(t.slice(0,20))){t='Hola, ¿cómo están en '+bn+'? '+t}
return t}

const it=(c.int||'').split(/[,;]/)[0].trim().toLowerCase(),b=buys(c),dl=b.length?Math.round((Date.now()-lastBuy(c))/864e5):0;
